            advisor: Prof. Hongliang Ren
            dates: Jun 2023 – Dec 2023
            description: >-
              Built and deployed a semi-autonomous, ROS-controlled data collection
              system using an Olympus duodenoscope, producing the first in-vivo,
              in-cavity gastrointestinal dataset with complete ground truth for
              dense 3D reconstruction. Designed a monocular NeRF framework that
              separates diffuse and specular radiance to handle near-field
              lighting, fluids, and exposure changes in endoscopy. This work was
