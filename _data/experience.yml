      - id: cmu
        sort_date: 202408
        card_date: '2024'
        subtitle: Education & Research
        label: CMU
        name: Carnegie Mellon University
        years: Aug 2024 – May 2026
        logo: img/experience/cmu.jpg
        qualification: M.S. in Artificial Intelligence
        qualification_dates: Aug 2024 – Dec 2025
        roles:
          - title: Research Assistant
            team: Robots Perceiving and Doing Lab (R-PAD)
            advisor: Prof. David Held
            dates: Aug 2024 – May 2026
            description_paragraphs:
              - >-
                Developed a hierarchical, object-centric point diffusion framework
                combining dense Gaussian mixture model (GMM) global initialization
                with disentangled geometry and frame diffusion, achieving
                state-of-the-art placement precision, multimodal coverage, and
                generalization across rigid and non-rigid placement tasks. This work
                was accepted to ICRA 2026.
              - >-
                Developed ParticleSplat, a self-supervised, object-centric 3D
                representation learning framework that maps multi-view observations
                into compact latent particles and particle-aligned Gaussian splats.
                Trained through novel-view synthesis without segmentation
                supervision, the framework enables 3D object decomposition and
                controllable scene editing, while improving downstream robotic
                manipulation policies. This work is available as a preprint.
