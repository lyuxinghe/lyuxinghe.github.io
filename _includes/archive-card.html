<button class="archive-card" type="button" id="{{ include.id }}-card-{{ include.item_id }}" data-deck-card data-latest="{{ include.latest }}" aria-controls="{{ include.id }}-detail-{{ include.item_id }}">
  <span class="archive-card-pin" aria-hidden="true"></span>
  <span class="archive-card-media" data-shape="{{ include.card.image_shape | default: 'rectangle' | escape }}"{% if include.card.image_crop %} style="--image-zoom: {{ include.card.image_crop.zoom | escape }}; --image-origin: {{ include.card.image_crop.x | escape }}% {{ include.card.image_crop.y | escape }}%;"{% endif %}><img src="{{ include.card.image | relative_url }}" alt="" loading="lazy" width="480" height="270"></span>
  <span class="archive-card-year">{{ include.card.year | escape }}</span>
  <span class="archive-card-title">{{ include.card.title | escape }}{% if include.card.supporting_text %}<span class="archive-card-supporting">{{ include.card.supporting_text | escape }}</span>{% endif %}</span>
  <span class="archive-card-subtitle">{{ include.card.subtitle | escape }}</span>
</button>
